<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Instagram">

<!-- Angepasst auf PNG -->
<link rel="apple-touch-icon" href="Instagram_icon.png">

<title>Scroll Therapie</title>
<style>
:root {
--nav-height: 40px; /* Extrem schmal gemacht */
--safe-bottom: env(safe-area-inset-bottom);
}

body, html {
margin: 0;
padding: 0;
background-color: #000;
height: 100%;
overflow: hidden;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

/* --- ALLGEMEINE ICONS --- */
.icon {
width: 22px;
height: 22px;
fill: none;
stroke: #fff;
stroke-width: 2;
stroke-linecap: round;
stroke-linejoin: round;
}

/* --- UNTERE NAVIGATION (Minimaler Balken) --- */
#bottom-nav {
position: fixed;
bottom: 0;
left: 0;
width: 100%;
height: calc(var(--nav-height) + var(--safe-bottom));
background-color: #000;
border-top: 1px solid #1a1a1a;
display: flex;
justify-content: space-around;
align-items: center; /* Zentriert die Icons direkt auf Icon-Höhe */
padding-bottom: var(--safe-bottom);
z-index: 1000;
box-sizing: border-box;
}

.nav-btn {
width: 50%;
height: var(--nav-height);
display: flex;
justify-content: center;
align-items: center;
opacity: 0.4;
transition: opacity 0.2s;
}

.nav-btn.active {
opacity: 1;
}

/* --- ANSICHTEN --- */
.view {
position: absolute;
top: 0;
left: 0;
width: 100vw;
height: calc(100vh - var(--nav-height) - var(--safe-bottom));
display: none;
overflow-y: scroll;
-ms-overflow-style: none;
scrollbar-width: none;
}

.view::-webkit-scrollbar {
display: none;
}

.view.active {
display: block;
}

/* --- HOME FEED --- */
.home-post {
width: 100vw;
margin-bottom: 15px;
}

.home-header {
display: flex;
align-items: center;
padding: 8px 12px;
}

.story-ring {
width: 32px;
height: 32px;
border-radius: 50%;
border: 2px solid #444;
display: flex;
justify-content: center;
align-items: center;
margin-right: 10px;
}

.profile-pic {
width: 26px;
height: 26px;
border-radius: 50%;
background-color: #000;
border: 2px solid #000;
}

.username {
color: #fff;
font-weight: 600;
font-size: 13px;
}

.post-image {
width: 100vw;
height: 125vw;
background-color: #1a1a1a;
}

.home-footer {
display: flex;
justify-content: space-between;
padding: 10px 12px;
}

.footer-left {
display: flex;
gap: 16px;
}

/* --- REELS FEED --- */
#reels-view {
scroll-snap-type: y mandatory;
}

.reels-post {
height: 100%;
width: 100vw;
position: relative;
scroll-snap-align: start;
box-sizing: border-box;
border-top: 1px solid #222;
border-bottom: 1px solid #222;
background-color: #000;
margin-bottom: 2px;
}

.reels-icon-container {
position: absolute;
bottom: 30px; /* Perfekter Abstand über dem ultradünnen Balken */
right: 15px;
display: flex;
flex-direction: column;
gap: 20px;
align-items: center;
}
</style>
</head>
<body>

<div id="home-view" class="view active"></div>
<div id="reels-view" class="view"></div>

<div id="bottom-nav">
<div id="nav-home" class="nav-btn active">
<svg class="icon" viewBox="0 0 24 24">
<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
<polyline points="9 22 9 12 15 12 15 22"></polyline>
</svg>
</div>
<div id="nav-reels" class="nav-btn">
<svg class="icon" viewBox="0 0 24 24">
<rect x="3" y="3" width="18" height="18" rx="4" ry="4"></rect>
<polygon points="10 8 16 12 10 16 10 8" fill="#fff" stroke="none"></polygon>
</svg>
</div>
</div>

<script>
const heartIcon = `<svg class="icon" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>`;
const commentIcon = `<svg class="icon" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>`;
const shareIcon = `<svg class="icon" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>`;
const saveIcon = `<svg class="icon" viewBox="0 0 24 24"><polygon points="20 21 12 13.44 4 21 4 3 20 3 20 21"></polygon></svg>`;
const repostIcon = `<svg class="icon" viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>`;

const btnHome = document.getElementById('nav-home');
const btnReels = document.getElementById('nav-reels');
const viewHome = document.getElementById('home-view');
const viewReels = document.getElementById('reels-view');

btnHome.addEventListener('click', () => {
btnHome.classList.add('active');
btnReels.classList.remove('active');
viewHome.classList.add('active');
viewReels.classList.remove('active');
});

btnReels.addEventListener('click', () => {
btnReels.classList.add('active');
btnHome.classList.remove('active');
viewReels.classList.add('active');
viewHome.classList.remove('active');
});

function createHomePost() {
const post = document.createElement('div');
post.className = 'home-post';
post.innerHTML = `
<div class="home-header">
<div class="story-ring">
<div class="profile-pic"></div>
</div>
<div class="username">just_stop</div>
</div>
<div class="post-image"></div>
<div class="home-footer">
<div class="footer-left">
${heartIcon}
${commentIcon}
${shareIcon}
</div>
<div class="footer-right">
${saveIcon}
</div>
</div>
`;
return post;
}

function createReelsPost() {
const post = document.createElement('div');
post.className = 'reels-post';
post.innerHTML = `
<div class="reels-icon-container">
${heartIcon}
${commentIcon}
${shareIcon}
${repostIcon}
</div>
`;
return post;
}

for (let i = 0; i < 5; i++) {
viewHome.appendChild(createHomePost());
viewReels.appendChild(createReelsPost());
}

viewHome.addEventListener('scroll', () => {
if (viewHome.scrollTop + viewHome.clientHeight >= viewHome.scrollHeight - 1000) {
for (let i = 0; i < 3; i++) {
viewHome.appendChild(createHomePost());
}
}
});

viewReels.addEventListener('scroll', () => {
if (viewReels.scrollTop + viewReels.clientHeight >= viewReels.scrollHeight - 1000) {
for (let i = 0; i < 3; i++) {
viewReels.appendChild(createReelsPost());
}
}
});
</script>
</body>
</html>
